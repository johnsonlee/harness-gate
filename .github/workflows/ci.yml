name: Harness Gate CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Node, React, Next.js and Bun
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: npm ci
      - run: npm run check
      - name: Build and verify checked-in Web and Bun examples
        run: |
          npm run pack:local
          node scripts/verify-examples.mjs node react next bun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-example-evidence
          path: .harness/example-results/
          if-no-files-found: error

  gradle:
    name: Java Gradle and Android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install required Android SDK
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          sdk = pathlib.Path(os.environ['ANDROID_HOME'])
          manager = sdk / 'cmdline-tools/latest/bin/sdkmanager'
          subprocess.run([str(manager), '--licenses'], input='y\n' * 100, text=True, check=True)
          subprocess.run([str(manager), 'platforms;android-35', 'build-tools;35.0.0'], check=True)
          assert (sdk / 'platforms/android-35/android.jar').is_file()
          PY
      - name: Native Gradle build and consumer tests
        working-directory: integrations/gradle
        run: ./gradlew build --no-daemon --stacktrace
      - name: Require executed Android and JVM tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('integrations/gradle').glob('*/build/test-results/test/TEST-*.xml'))
          assert reports, 'Missing Gradle test reports'
          names = set()
          for report in reports:
              suite = ET.parse(report).getroot()
              names.add(suite.attrib['name'])
              assert int(suite.attrib['tests']) > 0, report
              for outcome in ('failures', 'errors', 'skipped'):
                  assert int(suite.attrib.get(outcome, '0')) == 0, f'{report}: {outcome}'
          for required in ('AndroidConsumerTest', 'HarnessPluginTest', 'ForbiddenImportDetectorTest'):
              assert any(name.endswith('.' + required) for name in names), f'Missing {required}'
          PY
      - name: Verify checked-in Java and Android examples
        run: node scripts/verify-examples.mjs java-gradle android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-example-evidence
          path: .harness/example-results/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-test-reports
          path: integrations/gradle/*/build/reports/tests/
          if-no-files-found: error

  swift:
    name: SwiftPM and native Xcode iOS
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HARNESS_SKIP_XCODE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Xcode and Simulator SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-path
          swift --version
      - run: swift test --package-path integrations/swift
      - name: Native SwiftPM and Xcode consumer builds
        shell: bash
        run: |
          python3 integrations/swift/scripts/integration.py | tee swift-consumers.log
          python3 - <<'PY'
          from pathlib import Path
          log = Path('swift-consumers.log').read_text()
          assert 'PASS SwiftPM:' in log
          assert 'PASS Xcode iOS Simulator:' in log
          assert 'SKIP' not in log
          PY
      - name: Verify checked-in iOS example
        run: node scripts/verify-examples.mjs ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-example-evidence
          path: .harness/example-results/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-consumer-evidence
          path: swift-consumers.log
          if-no-files-found: error

  openapi:
    name: OpenAPI compatibility with real oasdiff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Install pinned oasdiff
        run: |
          mkdir -p "$RUNNER_TEMP/oasdiff-bin"
          GOBIN="$RUNNER_TEMP/oasdiff-bin" go install github.com/oasdiff/oasdiff@v1.27.0
          go version -m "$RUNNER_TEMP/oasdiff-bin/oasdiff"
      - name: Real contract compatibility tests
        env:
          HARNESS_OASDIFF: ${{ runner.temp }}/oasdiff-bin/oasdiff
        run: python3 integrations/openapi/test_integration.py

  required:
    name: Harness Gate required checks
    runs-on: ubuntu-24.04
    if: always()
    needs: [web, gradle, swift, openapi]
    timeout-minutes: 5
    steps:
      - name: Require every platform job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ['JOB_RESULTS'])
          required = {'web', 'gradle', 'swift', 'openapi'}
          assert set(results) == required, f'Missing platform jobs: {required - set(results)}'
          failed = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          assert not failed, f'Required jobs failed, cancelled or skipped: {failed}'
          PY
